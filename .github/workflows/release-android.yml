name: Release Android

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v2.3.0
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Install Android API 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0" >/dev/null
      - name: Validate tag and build unsigned release candidate
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          grep -F "versionName = \"$VERSION\"" app/build.gradle.kts
          ./gradlew --no-daemon --dependency-verification strict test lint assembleRelease cyclonedxBom
      - name: Validate CycloneDX schemas
        run: |
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/cyclonedx" \
            https://github.com/CycloneDX/cyclonedx-cli/releases/download/v0.33.1/cyclonedx-linux-x64
          echo "bfc8b2538da86fe239bc53658bbb63c1c8c510a293c1e6891aa5bea5d3c58746  $RUNNER_TEMP/cyclonedx" | sha256sum --check
          chmod +x "$RUNNER_TEMP/cyclonedx"
          "$RUNNER_TEMP/cyclonedx" validate --input-file build/reports/cyclonedx/bom.json
          "$RUNNER_TEMP/cyclonedx" validate --input-file build/reports/cyclonedx/bom.xml
      - name: Scan shipped Android and Python runtime dependencies
        uses: google/osv-scanner-action/osv-scanner-action@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0
        with:
          scan-args: |-
            -L build/reports/cyclonedx/bom.json
            -L desktop/requirements.lock.txt
      - name: Restore protected signing identity
        env:
          YTDOW_KEYSTORE_BASE64: ${{ secrets.YTDOW_KEYSTORE_BASE64 }}
        run: |
          test -n "$YTDOW_KEYSTORE_BASE64"
          printf '%s' "$YTDOW_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ytdow-release.p12"
          chmod 600 "$RUNNER_TEMP/ytdow-release.p12"
      - name: Build production-signed APK
        env:
          YTDOW_KEYSTORE: ${{ runner.temp }}/ytdow-release.p12
          YTDOW_STORE_PASSWORD: ${{ secrets.YTDOW_STORE_PASSWORD }}
          YTDOW_KEY_ALIAS: ${{ secrets.YTDOW_KEY_ALIAS }}
          YTDOW_KEY_PASSWORD: ${{ secrets.YTDOW_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --dependency-verification strict :app:productionRelease
      - name: Verify and name artifacts
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          YTDOW_EXPECTED_CERT_SHA256: ${{ secrets.YTDOW_EXPECTED_CERT_SHA256 }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          APK="app/build/outputs/apk/release/app-release.apk"
          test -n "$YTDOW_EXPECTED_CERT_SHA256"
          apksigner verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner.txt"
          grep -F "Verified using v1 scheme (JAR signing): false" "$RUNNER_TEMP/apksigner.txt"
          grep -F "Verified using v2 scheme (APK Signature Scheme v2): true" "$RUNNER_TEMP/apksigner.txt"
          grep -F "Verified using v3 scheme (APK Signature Scheme v3): true" "$RUNNER_TEMP/apksigner.txt"
          ! grep -F "CN=Android Debug" "$RUNNER_TEMP/apksigner.txt"
          ACTUAL_CERT_SHA256="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apksigner.txt")"
          EXPECTED_CERT_SHA256="$(printf '%s' "$YTDOW_EXPECTED_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256"
          zipalign -c -v 4 "$APK"
          aapt dump badging "$APK" > "$RUNNER_TEMP/apk-badging.txt"
          grep -F "package: name='com.jozhikbeznozhek.ytdow'" "$RUNNER_TEMP/apk-badging.txt"
          grep -F "versionName='$VERSION'" "$RUNNER_TEMP/apk-badging.txt"
          VERSION_CODE="$(sed -n "s/.*versionCode='\([0-9][0-9]*\)'.*/\1/p" "$RUNNER_TEMP/apk-badging.txt" | head -1)"
          test "$VERSION_CODE" -gt 8
          mkdir -p release
          cp "$APK" "release/YTDow-v$VERSION.apk"
          cp build/reports/cyclonedx/bom.json "release/YTDow-v$VERSION-sbom.json"
          cp build/reports/cyclonedx/bom.xml "release/YTDow-v$VERSION-sbom.xml"
          cd release
          sha256sum * > "YTDow-v$VERSION-SHA256SUMS.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ytdow-android-release
          path: release/
          if-no-files-found: error
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: release/YTDow-*.apk
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/* --verify-tag --generate-notes
