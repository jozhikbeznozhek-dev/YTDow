name: Release Android

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v2.3.0
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      YTDOW_STORE_PASSWORD: ${{ secrets.YTDOW_STORE_PASSWORD }}
      YTDOW_KEY_ALIAS: ${{ secrets.YTDOW_KEY_ALIAS }}
      YTDOW_KEY_PASSWORD: ${{ secrets.YTDOW_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Android API 36
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0
      - name: Restore protected signing identity
        env:
          YTDOW_KEYSTORE_BASE64: ${{ secrets.YTDOW_KEYSTORE_BASE64 }}
        run: |
          test -n "$YTDOW_KEYSTORE_BASE64"
          printf '%s' "$YTDOW_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ytdow-release.p12"
          chmod 600 "$RUNNER_TEMP/ytdow-release.p12"
          echo "YTDOW_KEYSTORE=$RUNNER_TEMP/ytdow-release.p12" >> "$GITHUB_ENV"
      - name: Validate tag and build signed release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          grep -F "versionName = \"$VERSION\"" app/build.gradle.kts
          ./gradlew --no-daemon test lint :app:productionRelease cyclonedxBom
      - name: Verify and name artifacts
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          EXPECTED_CERT_SHA256: ${{ secrets.YTDOW_EXPECTED_CERT_SHA256 }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          APK="app/build/outputs/apk/release/app-release.apk"
          apksigner verify --verbose --print-certs "$APK"
          ACTUAL_CERT_SHA256="$(apksigner verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          test -n "$EXPECTED_CERT_SHA256"
          test "${ACTUAL_CERT_SHA256,,}" = "${EXPECTED_CERT_SHA256,,}"
          mkdir -p release
          cp "$APK" "release/YTDow-v$VERSION.apk"
          cp build/reports/cyclonedx/bom.json "release/YTDow-v$VERSION-sbom.json"
          cp build/reports/cyclonedx/bom.xml "release/YTDow-v$VERSION-sbom.xml"
          cd release
          sha256sum * > "YTDow-v$VERSION-SHA256SUMS.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: ytdow-android-release
          path: release/
          if-no-files-found: error
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: release/YTDow-*.apk
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/* --verify-tag --generate-notes
